{% extends "base.html" %}

{% block title %}Reset Password - AHMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">Reset Password</h1>
    <p class="text-sm text-slate-500 mb-6">Enter your registered email address and we will send you a password reset link.</p>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
            <input type="email" name="email" id="id_email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow transition mt-2">
            Send Reset Link
        </button>
    </form>

    <p class="text-center text-sm text-slate-600 mt-6">
        <a href="{% url 'login' %}" class="text-indigo-600 hover:underline">Return to Login</a>
    </p>
</div>
{% endblock %}
