{% extends "base.html" %}

{% block title %}Reset Key &mdash; AHMS Terminal{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-10 px-4">
    <div class="w-full max-w-md space-y-6">
        <!-- Brand Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-500 shadow-lg shadow-indigo-500/20 mb-2">
                <i data-lucide="key" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">Reset Account Key</h1>
            <p class="text-xs text-slate-400">Enter your registered email to receive verification recovery instructions</p>
        </div>

        <!-- Form Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-emerald-500 to-cyan-500"></div>

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label for="id_email" class="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1.5 font-semibold">
                        Registered Email Address
                    </label>
                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        required
                        placeholder="investor@domain.com"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 font-mono transition"
                    >
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs font-mono uppercase tracking-wider shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2">
                        <span>Dispatch Recovery Link</span>
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-800/80 text-center">
                <a href="{% url 'login' %}" class="text-xs font-mono text-slate-400 hover:text-white transition">
                    &larr; Return to Authentication
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
