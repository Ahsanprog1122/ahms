{% extends "base.html" %}

{% block title %}Reset Link Sent - AHMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full mb-4">
        ✓
    </div>
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Check Your Email</h1>
    <p class="text-sm text-slate-600 mb-6">If the email provided matches an AHMS account, you will receive instructions to reset your password shortly.</p>
    <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline text-sm">Return to Login</a>
</div>
{% endblock %}
