{% extends "base.html" %}

{% block title %}Recovery Link Dispatched &mdash; AHMS{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-10 px-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl text-center space-y-4">
        <div class="w-12 h-12 rounded-xl bg-emerald-950/60 border border-emerald-800/80 text-emerald-400 flex items-center justify-center mx-auto">
            <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold text-white tracking-tight">Recovery Instructions Dispatched</h1>
        <p class="text-xs text-slate-400 leading-relaxed font-mono">
            If the address provided corresponds to an active account, secure recovery instructions have been transmitted.
        </p>
        <div class="pt-4">
            <a href="{% url 'login' %}" class="inline-block bg-slate-800 hover:bg-slate-700 text-white font-mono text-xs px-5 py-2.5 rounded-xl border border-slate-700 transition">
                Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
