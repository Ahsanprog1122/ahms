{% extends "base.html" %}

{% block title %}Password Updated &mdash; AHMS{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-10 px-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl text-center space-y-4">
        <div class="w-12 h-12 rounded-xl bg-emerald-950/60 border border-emerald-800/80 text-emerald-400 flex items-center justify-center mx-auto">
            <i data-lucide="check" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold text-white tracking-tight">Authentication Updated</h1>
        <p class="text-xs text-slate-400 font-mono">Your password has been successfully reset. You may now access the terminal.</p>
        <div class="pt-4">
            <a href="{% url 'login' %}" class="inline-block bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs font-mono uppercase px-6 py-3 rounded-xl shadow-lg transition">
                Sign In to Terminal
            </a>
        </div>
    </div>
</div>
{% endblock %}
