{% extends "base.html" %}

{% block title %}Password Reset Complete - AHMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full mb-4">
        ✓
    </div>
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Password Reset Successful</h1>
    <p class="text-sm text-slate-600 mb-6">Your password has been changed. You can now log in with your new credentials.</p>
    <a href="{% url 'login' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow">Log In</a>
</div>
{% endblock %}
